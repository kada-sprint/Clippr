x-backend: &backend
  image: cuplik-backend:local
  build:
    context: ./backend
  env_file:
    - ./backend/.env
  environment:
    NODE_ENV: development
    HOST: 0.0.0.0
    PORT: 3000
    REDIS_URL: redis://redis:6379
    FFMPEG_PATH: /usr/bin/ffmpeg
    FFPROBE_PATH: /usr/bin/ffprobe
    MEDIA_ROOT: /app/backend
  volumes:
    - media-data:/app/backend/uploads
    - ./backend/certs:/app/backend/certs:ro
  depends_on:
    redis:
      condition: service_healthy
  init: true
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: ["node", "server.js"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    command: ["node", "worker.js"]
    stop_grace_period: 30m

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
  media-data:
