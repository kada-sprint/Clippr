openapi: 3.0.3
info:
  title: Clippr API — Autentikasi
  version: 0.2.0
  description: >-
    Health dan autentikasi Google diimplementasikan. Login menerbitkan cookie sesi
    HttpOnly bertanda tangan dengan masa berlaku absolut satu jam; tidak diperpanjang
    oleh polling. /auth/me membaca profil sesi dari database. Endpoint proyek/klip masih draft.
    POST autentikasi memerlukan Origin yang persis cocok dengan FRONTEND_ORIGIN dan JSON.
servers:
  - url: http://localhost:3000/api
paths:
  /health:
    get:
      operationId: health
      summary: Status proses HTTP; bukan readiness database
      responses:
        '200':
          description: API berjalan
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /auth/google:
    post:
      operationId: verifyGoogle
      summary: Verifikasi ID token dan upsert profil berdasarkan Google subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, minLength: 1, maxLength: 16384 }
      responses:
        '200':
          description: Identitas diverifikasi dan disimpan; cookie clippr_session dan clippr_session.sig diterbitkan (HttpOnly, SameSite=Lax, Secure di produksi)
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    type: object
                    required: [id, email, displayName, avatarUrl]
                    properties:
                      id: { type: string, description: Google subject }
                      email: { type: string, format: email }
                      displayName: { type: string }
                      avatarUrl: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: INVALID_GOOGLE_TOKEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: PAYLOAD_TOO_LARGE (JSON body melebihi 20kb)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: ORIGIN_NOT_ALLOWED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: JSON_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: GOOGLE_NOT_CONFIGURED, GOOGLE_UNAVAILABLE, DATABASE_NOT_CONFIGURED, DATABASE_UNAVAILABLE, SESSION_NOT_CONFIGURED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/me:
    get:
      operationId: currentUser
      summary: Profil pengguna dari cookie sesi aktif; identitas tidak diambil dari query/body
      security:
        - sessionCookie: []
          sessionSignature: []
      responses:
        '200':
          description: Profil terbaru dari database, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: UNAUTHENTICATED (cookie hilang, palsu, kedaluwarsa, atau pengguna tidak ditemukan)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: SESSION_NOT_CONFIGURED, DATABASE_NOT_CONFIGURED, DATABASE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      operationId: logout
      summary: Hapus cookie sesi pada browser ini; idempoten
      description: >-
        Kirim JSON kosong dan Origin yang dikonfigurasi. Cookie bertanda tangan bersifat
        stateless; salinan cookie yang sudah dicuri tetap berlaku hingga kedaluwarsa.
        Pencabutan seluruh sesi lintas perangkat belum tersedia.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '204':
          description: Cookie browser dihapus, Cache-Control no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: ORIGIN_NOT_ALLOWED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: JSON_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: SESSION_NOT_CONFIGURED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: clippr_session
    sessionSignature:
      type: apiKey
      in: cookie
      name: clippr_session.sig
  schemas:
    User:
      type: object
      required: [id, email, displayName, avatarUrl]
      properties:
        id: { type: string, description: Google subject }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
    SubtitleStyle:
      type: string
      enum: [clean, active_word_highlight]
      default: clean
      description: Gaya subtitle tersimpan per klip; kontrak endpoint klip masih draft.
    ClipSubtitleUpdate:
      type: object
      description: >-
        Bagian payload draft PATCH klip untuk gaya subtitle. Field boleh tidak dikirim
        saat edit field lain; jika tidak dikirim, pertahankan nilai tersimpan.
        Default clean berlaku saat klip dibuat, bukan untuk mereset edit parsial.
      properties:
        subtitleStyle:
          $ref: '#/components/schemas/SubtitleStyle'
    ClipSubtitleFields:
      type: object
      description: Bagian respons klip; harus digabung dengan field klip lainnya sebelum implementasi endpoint.
      required: [subtitleStyle]
      properties:
        subtitleStyle:
          $ref: '#/components/schemas/SubtitleStyle'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: INVALID_CREDENTIAL atau INVALID_JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
x-future-endpoints:
  description: Draft berikut belum diimplementasikan; detail request/response wajib disepakati pemilik sebelum integrasi.
  authentication: Cookie HttpOnly dan profil sesi tersedia; endpoint proyek/klip berikutnya wajib memakai middleware sesi, requireAuth, dan memeriksa pemilik di backend.
  validation: >-
    Belum diimplementasikan pada pipeline H-01: maksimal 20 istilah; transkrip per kata
    dengan word, start_time, end_time, confidence; hasil kurasi 3–5 klip masing-masing
    25–75 detik; layout/subtitle hanya nilai yang didukung. Nilai subtitleStyle dibatasi
    oleh SubtitleStyle; default clean saat pembuatan klip.
  retention: >-
    Belum diimplementasikan: sumber kedaluwarsa 24 jam setelah upload/upload ulang berhasil;
    MP4/SRT 24 jam setelah render berhasil. Edit hanya mencatat aktivitas; edit, polling,
    dan unduhan tidak memperpanjang retensi. Pertahankan metadata/transkrip, kosongkan path
    setelah pembersihan, tunda media job aktif, dan minta upload ulang jika sumber hilang.
  clip-contract:
    status: draft
    update-fields:
      $ref: '#/components/schemas/ClipSubtitleUpdate'
    response-fields:
      $ref: '#/components/schemas/ClipSubtitleFields'
  endpoints:
    - { owner: A, method: GET, path: /projects, purpose: Daftar proyek pengguna }
    - { owner: A, method: POST, path: /projects, purpose: Buat metadata proyek }
    - { owner: A, method: GET, path: '/projects/{id}', purpose: Detail dan status untuk polling }
    - { owner: A, method: PATCH, path: '/projects/{id}', purpose: Edit metadata }
    - { owner: A, method: DELETE, path: '/projects/{id}', purpose: Hapus proyek dengan pemeriksaan job aktif }
    - { owner: B, method: POST, path: '/projects/{id}/source', purpose: Upload atau upload ulang sumber asli }
    - { owner: C, method: GET, path: '/projects/{id}/clips', purpose: Hasil kurasi }
    - { owner: C, method: PATCH, path: '/clips/{id}', purpose: Simpan edit klip }
    - { owner: C, method: POST, path: '/clips/{id}/render', purpose: Render ulang satu klip }
    - { owner: C, method: GET, path: '/clips/{id}/preview', purpose: Preview privat }
    - { owner: C, method: GET, path: '/clips/{id}/exports/{format}', purpose: Unduh MP4 atau SRT privat }
